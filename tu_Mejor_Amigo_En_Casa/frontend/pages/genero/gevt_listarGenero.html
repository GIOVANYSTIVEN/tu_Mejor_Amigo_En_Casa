<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Géneros - gevt</title>
  <link rel="stylesheet" href="../../css/genero/gevt_genero.css">
</head>
<body>
  <div class="contenedor-principal">
    <div class="barra-lateral">
      <iframe src="../../components/gevt_sideBar.html" frameborder="0" style="width: 100%; height: 100%;"></iframe>
    </div>
    <div class="contenido">
      <h2>Administrar Géneros - gevt</h2>
      <form id="formGenero">
        <button type="submit" class="btn-agregar">+ Adicionar</button>
        <input type="hidden" id="generoId">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>
      </form>
      <ul id="listaGeneros" class="lista-generos"></ul>
    </div>
  </div>
  <script type="module" src="../../js/genero/gevt_listarGenero.js"></script>
</body>
</html>
