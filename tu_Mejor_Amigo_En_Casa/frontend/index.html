<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - gevt</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="contenedor-imagen-gevt">
    <div class="contenedor-formulario">
      <form id="loginForm">
        <div class="grupo-formulario-gevt">
          <input type="email" id="correoGevt" placeholder="Correo Electrónico" required>
        </div>
        <div class="grupo-formulario-gevt " >
          <input type="password" id="passwordGevt" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="boton-ingresar-gevt">Ingresar</button>
        <p id="mensaje" class="mensaje-error-gevt"></p>
      </form>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
